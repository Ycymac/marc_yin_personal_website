<!doctype html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>线描候选预览 · Line-art Gallery</title>
<style>
  :root { --ink: #1c1c1f; --paper: #eceae6; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 80px;
    font-family: Georgia, "Noto Serif SC", serif;
    background: var(--paper); color: var(--ink);
    transition: background .3s, color .3s;
  }
  body.dark { --ink: #e9e9e7; --paper: #141416; }
  h1 { font-weight: 600; letter-spacing: .04em; font-size: 1.6rem; }
  .sub { color: gray; font-size: .9rem; margin-bottom: 28px; }
  .toggle {
    border: 1px solid currentColor; background: transparent; color: inherit;
    padding: 8px 18px; border-radius: 3px; cursor: pointer;
    font-family: inherit; font-size: .85rem; margin-bottom: 32px;
  }
  .grid {
    display: grid; gap: 24px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    border: 1px solid currentColor; border-radius: 4px;
    padding: 20px; display: flex; flex-direction: column; align-items: center;
  }
  .card svg { width: 160px; height: 160px; }
  .card .no { font-size: .8rem; opacity: .55; align-self: flex-start; }
  .card .name { margin-top: 14px; font-weight: 600; font-size: .95rem; }
  .card .use { font-size: .78rem; color: gray; text-align: center; margin-top: 4px; }
  svg { stroke: currentColor; fill: none; stroke-width: 1.2; }
  svg .fillink { fill: currentColor; stroke: none; }
</style>
</head>
